openapi: 3.0.3
info:
  title: Notes API
  version: 1.0.0
  description: Notion-ish notes with an embedded todo checklist, kept in a Mockoon data bucket.
servers:
  - url: http://localhost:3001/api
tags:
  - name: notes
paths:
  /notes:
    x-mockoon:
      crud: notes
    get:
      tags: [notes]
      operationId: listNotes
      summary: List notes
      parameters:
        - { name: search, in: query, schema: { type: string } }
      responses:
        '200':
          description: The notes
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Note' } }
    post:
      tags: [notes]
      operationId: createNote
      summary: Create a note
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NoteDraft' }
      responses:
        '201':
          description: The created note
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Note' }
  /notes/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [notes]
      operationId: getNote
      summary: Get a note
      responses:
        '200':
          description: The note
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Note' }
        '404': { description: Not found }
    put:
      tags: [notes]
      operationId: updateNote
      summary: Replace a note
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NoteDraft' }
      responses:
        '200':
          description: The updated note
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Note' }
        '404': { description: Not found }
    patch:
      tags: [notes]
      operationId: patchNote
      summary: Merge changes into a note
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: The updated note
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Note' }
        '404': { description: Not found }
    delete:
      tags: [notes]
      operationId: deleteNote
      summary: Delete a note
      responses:
        '200': { description: Deleted }
        '404': { description: Not found }
components:
  schemas:
    Todo:
      type: object
      required: [id, text, done]
      properties:
        id: { type: string }
        text: { type: string }
        done: { type: boolean }
    NoteDraft:
      type: object
      required: [title]
      properties:
        title: { type: string }
        body: { type: string }
        todos: { type: array, items: { $ref: '#/components/schemas/Todo' } }
        updatedAt: { type: string, format: date-time }
    Note:
      allOf:
        - type: object
          required: [id]
          properties:
            id: { type: string }
        - $ref: '#/components/schemas/NoteDraft'
