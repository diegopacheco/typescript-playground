<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TypeScript Playground</title>
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center; font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f5f7fb; color: #1d2433; -webkit-app-region: drag; }
  .card { width: 420px; padding: 32px; background: #fff; border: 1px solid #e2e6ef; border-radius: 16px; box-shadow: 0 10px 40px rgba(20,30,60,.08); text-align: center; }
  img { width: 72px; height: 72px; }
  h1 { font-size: 20px; margin: 14px 0 4px; }
  p { margin: 0 0 20px; color: #6b7489; font-size: 13px; }
  ul { list-style: none; margin: 0; padding: 0; text-align: left; }
  li { display: flex; align-items: center; gap: 10px; padding: 9px 4px; border-top: 1px solid #eef1f7; font-size: 14px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #d4d9e4; flex: none; }
  .loading .dot { background: #f0b429; animation: pulse 1s infinite; }
  .ready .dot { background: #138a52; }
  .error .dot { background: #d93f3f; }
  .state { margin-left: auto; font-size: 12px; color: #6b7489; }
  .err { color: #d93f3f; font-size: 12px; white-space: pre-wrap; text-align: left; margin-top: 12px; }
  @keyframes pulse { 50% { opacity: .35; } }
</style>
</head>
<body>
<div class="card">
  <img src="icon.png" alt="">
  <h1>TypeScript Playground</h1>
  <p>Booting services...</p>
  <ul id="list"></ul>
  <div id="err" class="err"></div>
</div>
<script>
  const list = document.getElementById("list");
  window.desktop.onBoot(({ services, error }) => {
    list.innerHTML = services.map((s) => '<li class="' + s.status + '"><span class="dot"></span><span>' + s.name + '</span><span class="state">' + s.status + "</span></li>").join("");
    document.getElementById("err").textContent = error || "";
  });
</script>
</body>
</html>
