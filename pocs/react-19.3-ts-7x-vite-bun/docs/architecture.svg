<text x="150" y="143" text-anchor="middle" class="label">Browser request</text><text x="150" y="178" text-anchor="middle" class="small">?workspace=studio</text>
<text x="465" y="143" text-anchor="middle" class="label">Bun + Vite RSC</text><text x="465" y="178" text-anchor="middle" class="small">AsyncLocalStorage per request</text>
